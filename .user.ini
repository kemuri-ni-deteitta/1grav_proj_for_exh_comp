; Per-directory PHP overrides for Grav Admin
; Fixes "Page Expired" on large forms by allowing more POST fields

; Allow very large admin forms (media lists, repeaters, etc.)
max_input_vars = 20000
suhosin.post.max_vars = 20000
suhosin.request.max_vars = 20000

; Keep in sync with repo php.ini but ensure FPM/CGI picks these up
max_execution_time = 1800
max_input_time = 1800
memory_limit = 512M
post_max_size = 256M
upload_max_filesize = 64M

; Longer admin sessions
session.gc_maxlifetime = 86400
session.save_path="/home/ivan/grav-admin/tmp/sessions"
session.cookie_httponly=1
session.use_strict_mode=1
