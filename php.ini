; PHP Configuration for Grav Admin
; This file overrides default PHP settings for file uploads

; File upload settings
file_uploads = On
max_file_uploads = 20
upload_max_filesize = 32M
post_max_size = 128M

; Execution time settings
max_execution_time = 1800
max_input_time = 1800

; Memory settings
memory_limit = 512M

; Error reporting (for development)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Input variables and multipart limits for Grav Admin
max_input_vars = 10000
max_multipart_body_parts = 5000
max_input_nesting_level = 128

; Session settings for admin security
session.gc_maxlifetime = 1440
session.cookie_httponly = 1
session.use_strict_mode = 1

; Additional settings for Grav Admin compatibility
auto_detect_line_endings = Off
default_charset = "UTF-8"
mbstring.func_overload = 0
mbstring.internal_encoding = "UTF-8"

; Form processing and timeout settings
post_max_size = 256M
max_file_uploads = 50
upload_max_filesize = 64M
max_input_vars = 15000
max_multipart_body_parts = 10000
