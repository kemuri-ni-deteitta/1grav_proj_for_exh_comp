# Common Grav CMS Configuration Snippet
# This file contains shared location blocks and security rules for Grav CMS

# Default index files to serve when accessing directories
index index.html index.php;

## Main Front Controller - Handles all Grav routing
# This location block is now handled in the main server configuration
# to avoid duplicate location blocks
# location / {
# 	try_files $uri $uri/ /index.php?$query_string;
# }

## Security Rules - Deny direct access to sensitive areas
# Block access to version control and system directories
location ~* /(\.git|cache|bin|logs|backup|tests)/.*$ { return 403; }

# Block access to system and vendor files that could expose sensitive information
# Prevents access to PHP, configuration, and documentation files in core directories
location ~* /(system|vendor)/.*\.(txt|xml|md|html|htm|shtml|shtm|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }

# Block access to user folder files that could contain sensitive data
# Prevents direct access to user configurations, content, and PHP files
location ~* /user/.*\.(txt|md|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }

# Block access to root-level configuration and system files
# Protects composer files, web server configs, and license information
location ~ /(LICENSE\.txt|composer\.lock|composer\.json|nginx\.conf|web\.config|htaccess\.txt|\.htaccess) { return 403; }

## Static Assets Caching - Optimize performance for different file types
# CSS and JavaScript files - cache for 7 days
location ~* \.(?:css|js)$ {
	expires 7d;                                                    # Set cache expiration to 7 days
	access_log off;                                                # Disable access logging for performance
	add_header Cache-Control "public, must-revalidate, proxy-revalidate"; # Cache control headers
}

# Image files - cache for 30 days (images rarely change)
location ~* \.(?:png|gif|ico|jpe?g|svg|webp)$ {
	expires 30d;                                                   # Set cache expiration to 30 days
	access_log off;                                                # Disable access logging for performance
	add_header Cache-Control "public, must-revalidate, proxy-revalidate"; # Cache control headers
}

# Font files - cache for 30 days (fonts rarely change)
location ~* \.(?:woff2?|ttf|eot)$ {
	expires 30d;                                                   # Set cache expiration to 30 days
	access_log off;                                                # Disable access logging for performance
	add_header Cache-Control "public, must-revalidate, proxy-revalidate"; # Cache control headers
}

## Miscellaneous Static Files
# Favicon - disable logging for this commonly requested file
location = /favicon.ico { 
	log_not_found off;                                             # Don't log 404 errors
	access_log off;                                                # Disable access logging
}

# Robots.txt - allow access and disable logging
location = /robots.txt  { 
	allow all;                                                     # Allow all access
	log_not_found off;                                             # Don't log 404 errors
	access_log off;                                                # Disable access logging
}


